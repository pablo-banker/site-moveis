<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Forma — Catálogo indisponível</title>
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				color: #242424;
				background: #f7f7f5;
				font:
					18px/1.6 Arial,
					sans-serif;
			}
			main {
				min-height: 100svh;
				max-width: 780px;
				margin: auto;
				padding: 10vh 28px;
			}
			.brand {
				font-size: 42px;
				font-weight: 700;
				letter-spacing: -3px;
				color: inherit;
				text-decoration: none;
			}
			.status {
				margin-top: 12vh;
				color: #666;
			}
			h1 {
				font-size: clamp(32px, 5vw, 52px);
				line-height: 1.15;
				letter-spacing: -1.5px;
			}
			.button {
				display: inline-block;
				margin-top: 24px;
				padding: 14px 24px;
				border-radius: 12px;
				background: #242424;
				color: white;
				text-decoration: none;
			}
			a:focus-visible {
				outline: 3px solid #666;
				outline-offset: 5px;
			}
		</style>
	</head>
	<body>
		<main>
			<a class="brand" href="/" aria-label="Forma, início">forma</a>
			<p class="status">Erro %sveltekit.status%</p>
			<h1>%sveltekit.error.message%</h1>
			<p>Você pode tentar acessar novamente em instantes.</p>
			<a class="button" href="">Tentar novamente</a>
		</main>
	</body>
</html>
